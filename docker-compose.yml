services:
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
        - /var/run/docker.sock:/tmp/docker.sock:ro
        - certs:/etc/nginx/certs
        - vhost-d:/etc/nginx/vhost.d
        - html:/usr/share/nginx/html
        - acme:/etc/acme.sh
    networks:
      - proxy

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-acme
    restart: unless-stopped
    depends_on:
      - "nginx-proxy"
    volumes_from:
       - "nginx-proxy"
    volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
        - certs:/etc/nginx/certs
        - acme:/etc/acme.sh
    environment:
        - DEFAULT_EMAIL=${email}
    networks:
      - proxy

  frontend:
    build: frontend
    container_name: frontend
    restart: unless-stopped
    expose:
        - "80"
    volumes:
      - ./frontend/src:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    environment:
      - VIRTUAL_HOST=mealtastic.me
      - LETSENCRYPT_HOST=mealtastic.me
      - NEXT_PUBLIC_API_URL=mealtastic.me
      - VIRTUAL_PORT=3000
    depends_on:
      - backend

  backend:
    build: backend
    image: backend
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
    environment:
      - VIRTUAL_HOST=mealtastic.me
      - VIRTUAL_PATH=/api/
      - VIRTUAL_PORT=3001
    networks:
      - proxy
      - internal
  
  # initial db setup using chatgpt: https://chatgpt.com/s/t_6928e960bc948191bb143b7247ec6825 prompt: what is the best way to install postgres on my web server?
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mealtastic
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
  
  memcached:
    image: memcached:latest
    container_name: memcached
    restart: unless-stopped
    command: memcached -m 64 -p 11211
    networks:
      - internal
    expose:
      - "11211"
    # ports:
    #   - "5432:5432" 
  # mongo:
  #   image: mongo
  #   container_name: mongo
  #   restart: always
  #   volumes:
  #     - ./data:/data

networks:
  proxy:
    driver: bridge
  internal:
    driver: bridge

volumes:
  certs:
  vhost-d:
  html:
  acme:
  pgdata:
